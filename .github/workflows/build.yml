name: build

on:
  push:
    branches: [main]
    paths: ["lists/**", "sources.txt", "build.py", ".github/workflows/build.yml"]
  schedule:
    - cron: "17 */2 * * *"   # every 2 hours: pick up upstream list updates
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Previous release
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download --repo "$GITHUB_REPOSITORY" --pattern sha256sums.txt --pattern proxy.txt --dir prev 2>/dev/null; then
            echo "count=$(wc -l < prev/proxy.txt)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          PREV_PROXY_COUNT: ${{ steps.prev.outputs.count }}
        run: python3 build.py

      - name: Publish if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f prev/sha256sums.txt ] && cmp -s prev/sha256sums.txt dist/sha256sums.txt; then
            echo "No changes, not publishing."; exit 0
          fi
          tag=$(date -u +%Y%m%d%H%M)
          gh release create "$tag" dist/geosite.dat dist/proxy.txt dist/exclude.txt dist/cidr.txt dist/mikrotik.rsc dist/sha256sums.txt dist/stats.txt \
            --repo "$GITHUB_REPOSITORY" --title "$tag" --notes-file dist/stats.txt --latest
          # keep the 20 newest releases
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[20:][].tagName' |
            xargs -r -I{} gh release delete {} --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
